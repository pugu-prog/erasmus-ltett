<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Besichtigungsplan Portugal</title>
<style>
  :root { --ground:#F5F7FA; --paper:#FFFFFF; --ink:#16202E; --muted:#5B6778; --rule:#D6DDE7; --accent:#1C4E8C; --err:#A3261B; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --ground:#0F1620; --paper:#16202C; --ink:#E6ECF3; --muted:#97A3B3; --rule:#2A3747; --accent:#8DB4E8; --err:#F2A097; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ground); color:var(--ink);
         font:400 15px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; padding-inline:16px; }
  form { width:100%; max-width:360px; background:var(--paper); border:1px solid var(--rule); border-radius:12px;
         padding:28px 24px; display:grid; gap:12px; }
  h1 { font:600 22px/1.2 Georgia,"Times New Roman",serif; margin:0; }
  p { margin:0; color:var(--muted); font-size:14px; }
  label { font-size:13px; font-weight:600; }
  input { font:inherit; padding:10px 12px; border:1px solid var(--rule); border-radius:8px; background:var(--ground); color:var(--ink); }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { font:inherit; font-weight:600; padding:10px 12px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#0F1620; } }
  .err { color:var(--err); font-size:13px; min-height:1.2em; }
</style>
</head>

  <input id="code" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Öffnen</button>

</form>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(SALT), iterations:ITER, hash:"SHA-256"}, base,

  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(IV)}, key, u8(DATA));
  const html = new TextDecoder().decode(plain);
  try { sessionStorage.setItem("bp-code", code); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById("login").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = document.getElementById("err"); err.textContent = "";
  try { await open_(document.getElementById("code").value.trim()); }
  catch (e) { err.textContent = "Code falsch. Bitte noch einmal versuchen."; }
});
